version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pensar_db
    restart: always
    environment:
      POSTGRES_USER: pensar_user
      POSTGRES_PASSWORD: pensar_password
      POSTGRES_DB: pensar_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: pensar_api
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      # Dentro de la red de compose la base de datos se llama "db", no "localhost"
      DATABASE_URL: postgresql+psycopg://pensar_user:pensar_password@db:5432/pensar_db
    ports:
      - "8000:8000"

volumes:
  pgdata: