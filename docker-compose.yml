services:
  db:
    image: postgres:15-alpine
    container_name: pensar_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pensar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env de la raiz (ver .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-pensar_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: pensar_api
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      # Dentro de la red de compose la base de datos se llama "db", no "localhost"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pensar_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pensar_db}
    ports:
      - "8000:8000"

volumes:
  pgdata: